# Each push publishes the app image to ghcr.io/<owner>/ratepp, which Unraid
# installs from its template (unraid/puntuaciones.xml). webapp-rewrite
# publishes too until it is merged into main.
name: Imagen Docker

on:
  push:
    branches: [main, webapp-rewrite]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Web (types and build)
        working-directory: web
        run: npm ci && npm run build
      - name: Backend (dependencies and modules load)
        working-directory: backend
        run: npm ci --omit=dev && node -e "for (const f of ['config','access','routes/scores','routes/groups','routes/geo','routes/thumbs','routes/admin','routes/templates','routes/push','push']) require('./src/' + f)"

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ratepp:latest
            ghcr.io/${{ github.repository_owner }}/ratepp:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Puntuaciones
          cache-from: type=gha
          cache-to: type=gha,mode=max
