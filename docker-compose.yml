services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: puntuaciones
      POSTGRES_PASSWORD: puntuaciones
      POSTGRES_DB: puntuaciones
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puntuaciones"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://puntuaciones:puntuaciones@db:5432/puntuaciones
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      UPLOADS_DIR: /app/uploads
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
