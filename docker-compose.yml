services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: puntuaciones
      POSTGRES_PASSWORD: puntuaciones
      POSTGRES_DB: puntuaciones
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puntuaciones"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Keeps the name "api" so the stack looks the same in Portainer, but it now
  # also serves the web app (see Dockerfile at the repo root).
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://puntuaciones:puntuaciones@db:5432/puntuaciones
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      UPLOADS_DIR: /app/uploads
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      # false closes sign-ups (the login screen hides "Regístrate").
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # Set when a reverse proxy sits in front (tailscale serve, Caddy, NPM,
      # Cloudflare Tunnel) so rate limits see the real client IP. Examples:
      # "loopback", "1", "172.16.0.0/12". Empty = trust no proxy.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Map tiles and geocoding default to OpenStreetMap/Nominatim (light use only).
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      GEOCODER_URL: ${GEOCODER_URL:-}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional daily backups (enable with COMPOSE_PROFILES=backup, or the
  # "backup" profile in Portainer). Writes to BACKUP_DIR on the host:
  #   db/puntuaciones-YYYY-MM-DD.sql.gz   one per day, older than
  #                                       BACKUP_KEEP_DAYS are deleted
  #   uploads/                            mirror of the photos volume (photo
  #                                       files never change, so new ones are
  #                                       just added)
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: puntuaciones
      PGPASSWORD: puntuaciones
      PGDATABASE: puntuaciones
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/uploads:ro
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /backups/db /backups/uploads
        while true; do
          day=$$(date +%F)
          pg_dump | gzip > /backups/db/puntuaciones-$$day.sql.gz.tmp && mv /backups/db/puntuaciones-$$day.sql.gz.tmp /backups/db/puntuaciones-$$day.sql.gz && echo "backup $$day ok"
          # Photo files never change: copy only the new ones (skips .thumbs).
          cd /uploads && for f in *; do [ -f "$$f" ] && [ ! -e "/backups/uploads/$$f" ] && cp -p "$$f" /backups/uploads/; done; cd /
          find /backups/db -name 'puntuaciones-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  pgdata:
  uploads:
